<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Aplicação Web - UFMA</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistemas Web</h1>
            <p class="subtitle">Deploy de Aplicação Web (HTML5, CSS3 e Python)</p>
        </header>

        <main>
            <section class="card">
                <h2>Enviar Dados para o Back-end</h2>
                <form id="meuFormulario">
                    <div class="form-group">
                        <label for="nome">Seu Nome:</label>
                        <input type="text" id="nome" required placeholder="Digite seu nome">
                    </div>
                    <div class="form-group">
                        <label for="mensagem">Mensagem/Feedback:</label>
                        <textarea id="mensagem" required placeholder="Escreva algo para o servidor Python..."></textarea>
                    </div>
                    <button type="submit">Enviar para o Python</button>
                </form>
            </section>

            <section id="resultadoCard" class="card hidden">
                <h3>Resposta do Servidor:</h3>
                <p id="respostaServidor"></p>
            </section>
        </main>
    </div>

    <script>
        document.getElementById('meuFormulario').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const mensagem = document.getElementById('mensagem').value;

            // Fazendo a integração com o Back-end Python
            try {
                const response = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, mensagem })
                });

                const data = await response.json();
                
                // Exibindo o resultado na tela
                const resultadoCard = document.getElementById('resultadoCard');
                const respostaServidor = document.getElementById('respostaServidor');
                
             respostaServidor.innerText = data.mensagem_servidor || data.mensagem || "Dados processados!";
                resultadoCard.classList.remove('hidden');
            } catch (error) {
                console.error('Erro na integração:', error);
            }
        });
    </script>
</body>
</html>
